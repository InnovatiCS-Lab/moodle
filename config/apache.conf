ServerName localhost
ServerTokens Prod
ServerSignature Off
<Directory /innovatics/moodle>
    Require all denied
</Directory>
<Directory /innovatics/moodle/public>
    Options -Indexes
    AllowOverride None
    Require all granted
</Directory>
<FilesMatch "^(config\.php|composer\.(json|lock)|package(-lock)?\.json)$">
    Require all denied
</FilesMatch>
<DirectoryMatch "^/innovatics/moodle/public/(vendor|node_modules|\.git)(/|$)">
    Require all denied
</DirectoryMatch>

<FilesMatch "^\.">
    Require all denied
</FilesMatch>
