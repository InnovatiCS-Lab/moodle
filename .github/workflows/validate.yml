name: Validate image
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check shell syntax
        run: |
          for script in scripts/*.sh; do sh -n "$script"; done
      - name: Build migration baseline
        run: |
          docker build \
            --build-arg PHP_IMAGE="$(sed -n 's/^PHP_IMAGE=//p' .env.example)" \
            --build-arg MOODLE_COMMIT="$(sed -n 's/^MOODLE_COMMIT=//p' .env.example)" \
            --tag moodle-ci:test .
      - name: Test isolated persistent volumes
        env:
          TEST_IMAGE: moodle-ci:test
        run: python3 tests/test_volumes.py
